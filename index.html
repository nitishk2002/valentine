<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Surprise 💖</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        overflow: hidden;
        color: white;
    }

    h1 {
        margin-top: 120px;
        font-size: 40px;
    }

    .buttons {
        margin-top: 50px;
        position: relative;
        height: 300px;
    }

    button {
        padding: 15px 30px;
        font-size: 18px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        position: absolute;
        transition: 0.3s;
    }

    #yesBtn {
        background-color: #ff4b5c;
        left: 40%;
    }

    #noBtn {
        background-color: #333;
        left: 55%;
        color: white;
    }

    /* Congrats Page Hidden Initially */
    #congratsPage {
        display: none;
        margin-top: 120px;
        animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .heart {
        position: absolute;
        font-size: 20px;
        animation: float 6s linear infinite;
    }

    @keyframes float {
        from { transform: translateY(100vh); opacity: 1; }
        to { transform: translateY(-10vh); opacity: 0; }
    }
</style>
</head>

<body>

<!-- Question Page -->
<div id="questionPage">
    <h1>Will You Be My Valentine? 💕</h1>

    <div class="buttons">
        <button id="yesBtn">YES 💖</button>
        <button id="noBtn">NO 😜</button>
    </div>
</div>

<!-- Congrats Page -->
<div id="congratsPage">
    <h1>Yayyyyy! She Said YES 💍💖</h1>
    <p style="width:70%; margin:auto; font-size:20px;">
        This is the beginning of something beautiful.  
        You just made my world brighter and my heart happier.  
        I promise to fill your life with love, laughter and happiness.  
        Happy Valentine’s Day ❤️🌹
    </p>
</div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const questionPage = document.getElementById("questionPage");
    const congratsPage = document.getElementById("congratsPage");

    // NO button runs away
    noBtn.addEventListener("mouseover", function() {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 100);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });

    // YES button hides old page and shows new
    yesBtn.addEventListener("click", function() {
        questionPage.style.display = "none";
        congratsPage.style.display = "block";
    });

    // Floating hearts animation
    function createHeart() {
        const heart = document.createElement("div");
        heart.innerHTML = "💖";
        heart.classList.add("heart");
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 10 + "px";
        heart.style.animationDuration = Math.random() * 3 + 3 + "s";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }

    setInterval(createHeart, 300);
</script>

</body>
</html>
