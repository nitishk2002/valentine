<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Surprise 💖</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        overflow: hidden;
        color: white;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #questionPage, #congratsPage{
        width:100%;
        padding:20px;
    }

    h1 {
        font-size: 28px;
        margin-bottom:40px;
    }

    .buttons {
        position: relative;
        height: 200px;
        width:100%;
    }

    button {
        padding: 12px 25px;
        font-size: 16px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        position: absolute;
        transition: 0.3s;
    }

    #yesBtn {
        background-color: #ff4b5c;
        left: 25%;
        top: 60px;
    }

    #noBtn {
        background-color: #333;
        color: white;
        left: 55%;
        top: 60px;
    }

    /* Congrats Page Hidden */
    #congratsPage {
        display: none;
        animation: fadeIn 1.5s ease-in-out;
    }

    #congratsPage p{
        font-size:18px;
        margin-top:20px;
        line-height:1.6;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.8); }
        to { opacity: 1; transform: scale(1); }
    }

    .heart {
        position: absolute;
        font-size: 18px;
        animation: float 6s linear infinite;
    }

    @keyframes float {
        from { transform: translateY(100vh); opacity: 1; }
        to { transform: translateY(-10vh); opacity: 0; }
    }
</style>
</head>

<body>

<!-- Question Page -->
<div id="questionPage">
    <h1>Will You Be My Valentine? 💕</h1>

    <div class="buttons">
        <button id="yesBtn">YES 💖</button>
        <button id="noBtn">NO 😜</button>
    </div>
</div>

<!-- Congrats Page -->
<div id="congratsPage">
    <h1>Yayyyyy! She Said YES 💍💖</h1>
    <p>
        This is the beginning of something beautiful.  
        You just made my world brighter and my heart happier.  
        I promise to fill your life with love, laughter and happiness.  
        Happy Valentine’s Day ❤️🌹
    </p>
</div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const questionPage = document.getElementById("questionPage");
    const congratsPage = document.getElementById("congratsPage");

    // Mobile friendly NO button movement
    noBtn.addEventListener("touchstart", moveButton);
    noBtn.addEventListener("mouseover", moveButton);

    function moveButton() {
        const maxX = window.innerWidth - 100;
        const maxY = window.innerHeight - 60;

        const x = Math.random() * maxX;
        const y = Math.random() * maxY;

        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }

    // YES button
    yesBtn.addEventListener("click", function() {
        questionPage.style.display = "none";
        congratsPage.style.display = "block";
    });

    // Floating hearts
    function createHeart() {
        const heart = document.createElement("div");
        heart.innerHTML = "💖";
        heart.classList.add("heart");
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 15 + 10 + "px";
        heart.style.animationDuration = Math.random() * 3 + 3 + "s";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }

    setInterval(createHeart, 400);
</script>

</body>
</html>
